[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The URL is supplied at runtime from printorian.core.config (see alembic/env.py).
sqlalchemy.url =

# No post-write hooks: resolving `ruff` from Alembic's subprocess depends on the
# venv being on PATH, which broke revision generation. `ruff format` is a CI gate
# and a documented local step, so run it after generating a migration.
[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
