[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "printorian"
version = "0.1.0"
description = "Printorian — automated 3D print farm management system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    "python-multipart>=0.0.20",
    # Mesh analysis: STL parsing and volume integration over large triangle arrays.
    "numpy>=2.1",
    # Payment gateway HTTP calls.
    "httpx>=0.28",
    # Encrypting printer access codes at rest (ADR-0014).
    "cryptography>=44",
    # Bambu LAN control: MQTT over TLS.
    "paho-mqtt>=2.1",
    # The IANA time zone database, for `farm_timezone`.
    #
    # `zoneinfo` reads the operating system's copy where there is one, so a Linux
    # container has never needed this — and Windows has no copy at all, which made
    # `ZoneInfo("Europe/Moscow")` raise on every developer machine. The packaging
    # sweep is the one that wanted it, so the symptom was that pass dying every
    # sixty seconds while the rest of the worker carried on, and nothing said so
    # until the loop heartbeats made a wedged sweep visible (`core.heartbeat`).
    #
    # Declared unconditionally rather than behind a `sys_platform` marker: pinning
    # the tz database is the more reproducible answer on any platform, and a farm
    # whose timezone rules come from whatever the base image happens to ship is a
    # farm whose open-hours arithmetic moves when the image is rebuilt.
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    # Starlette's TestClient (used for WebSocket tests) requires httpx2.
    "httpx2>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
    "aiosqlite>=0.20",
    # Sync driver, used only by the migration test to inspect the schema.
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
include = ["printorian*"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "DTZ",       # naive-datetime ban
    "PL",        # pylint subset
]
ignore = [
    "PLR0913",   # many arguments — common and fine for domain constructors
    # Prose in docstrings/comments deliberately uses typographic dashes and quotes.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Magic numbers read fine in assertions, and a local import is often the clearest
# way to show that a test is deliberately reaching for an internal.
"tests/**" = ["PLR2004", "PLC0415"]
"alembic/versions/*" = ["E501"]
# Standalone operator scripts: they print, and protocol constants are literals.
"tools/**" = ["PLR2004", "T201", "PLR0913", "PLR0911"]
# FastAPI declares query/form/body parameters as function parameters, so a route
# handler legitimately has many of them.
"printorian/api/routers/**" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Floats are banned in the pricing engine (ADR-0002). Enforced here as well as by review.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"decimal.getcontext".msg = "Do not mutate global decimal context; use core.money helpers."

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
files = ["printorian"]

# paho-mqtt does not export its public names in a way mypy can follow.
[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
# `tests` is imported as a package (`from tests.factories import ...`) but has no
# __init__.py, so it is only importable when `backend/` is on sys.path. Invoking
# as `python -m pytest` puts it there as a side effect of `-m`; the bare `pytest`
# console script does not, which is why CI failed on a suite that passed locally.
# Stating it here makes the import root a property of the project rather than of
# how someone happened to launch the runner.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: requires a live PostgreSQL instance",
    "hardware: requires a physical printer (never run in CI)",
]
filterwarnings = ["error"]
