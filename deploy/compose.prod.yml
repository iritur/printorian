# Printorian — the farm server (ADR-0003).
#
# This is the file the release gate runs in CI and the file that runs on the
# farm. Deliberately one file: a gate that exercises a different compose than
# production proves the images work in an arrangement nobody deploys.
#
# Everything environment-specific arrives from `.env` beside this file, rendered
# from the SOPS-encrypted store in Stage 2. Image digests are written by the
# promotion step in Stage 4 — `PRINTORIAN_IMAGE` carries a digest, not a tag, so
# what was proven is what runs.
#
#   docker compose -f deploy/compose.prod.yml up -d --wait

name: printorian

services:
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printorian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-printorian}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # On the farm this is a bind mount onto the backup disk, which must not be
      # the disk holding pgdata — ADR-0019, and the reason the runbook calls a
      # backup on the same spindle decoration.
      - ${PRINTORIAN_BACKUP_ROOT:-pgbackup}:/backup
    command:
      - postgres
      # Memory. Defaults here are the dev-scale numbers from the root
      # docker-compose.yml; the farm overrides them from its own RAM using the
      # table in RUNBOOK-BACKUP-RESTORE §3. Parameterised rather than guessed,
      # because the right value is a property of the box, not of this file.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      # WAL archiving. On from the start because `archive_mode` needs a restart
      # to change, and a farm that has run for a year is the worst place to
      # discover that (ADR-0019).
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /backup/wal && test ! -f /backup/wal/%f && cp %p /backup/wal/%f
      - -c
      - archive_timeout=60
      - -c
      - random_page_cost=1.1
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printorian} -d ${POSTGRES_DB:-printorian}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot. The API must not start against a schema it does not expect, and a
  # migration racing several API replicas is how one of them wins and the others
  # crash-loop. `service_completed_successfully` below makes the ordering a fact
  # rather than a hope.
  migrate:
    image: ${PRINTORIAN_IMAGE:?PRINTORIAN_IMAGE must be set}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    # Same inherited-healthcheck problem as workers, and worse here: migrate is a
    # one-shot that exits, so the curl never succeeds and docker records the
    # container as unhealthy for having done its job correctly. What matters is
    # its exit code, which is what the gate and the deploy timer read.
    healthcheck:
      disable: true
    environment: &backend_env
      PRINTORIAN_ENVIRONMENT: ${PRINTORIAN_ENVIRONMENT:-production}
      PRINTORIAN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-printorian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-printorian}
      PRINTORIAN_REDIS_URL: redis://redis:6379/0
      PRINTORIAN_SECRET_KEY: ${PRINTORIAN_SECRET_KEY:?PRINTORIAN_SECRET_KEY must be set}
      PRINTORIAN_STORAGE_ROOT: /srv/printorian/storage
      PRINTORIAN_FARM_TIMEZONE: ${PRINTORIAN_FARM_TIMEZONE:-Europe/Moscow}
      PRINTORIAN_SITE_URL: ${PRINTORIAN_SITE_URL:-http://localhost:5173}
      PRINTORIAN_PAYMENT_RETURN_URL: ${PRINTORIAN_PAYMENT_RETURN_URL:-http://localhost:5173/orders}
      PRINTORIAN_PAYMENT_PROVIDER: ${PRINTORIAN_PAYMENT_PROVIDER:-mock}
      PRINTORIAN_YOOKASSA_SHOP_ID: ${PRINTORIAN_YOOKASSA_SHOP_ID:-}
      PRINTORIAN_YOOKASSA_SECRET_KEY: ${PRINTORIAN_YOOKASSA_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${PRINTORIAN_IMAGE}
    restart: unless-stopped
    environment: *backend_env
    volumes:
      # The object store. A volume, never the container's writable layer — a
      # rebuild would otherwise take every uploaded model with it.
      - storage:/srv/printorian/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # A separate process, not a second API replica. The SLA clock, the scheduler
  # and the telemetry poller are singletons: running them inside the API would
  # run one copy per API worker, each recomputing the same credits and
  # publishing the same events (docs/DEVELOPMENT.md).
  workers:
    image: ${PRINTORIAN_IMAGE}
    restart: unless-stopped
    command: ["python", "-m", "printorian.workers"]
    environment: *backend_env
    # The image's healthcheck curls the API's /health, because the image is built
    # for three commands and only one of them serves HTTP. Inherited here it
    # reports a worker that is sweeping correctly as unhealthy, which in Stage 4
    # would make the deploy gate roll back good releases.
    #
    # Disabled rather than replaced with something like `pgrep`: a process check
    # passes for a worker deadlocked mid-sweep, and a liveness signal that cannot
    # distinguish working from wedged is worse than none — it is the same
    # objection ADR-0007 raises against a driver that returns plausible data.
    # Stage 5 adds /metrics with a last-sweep timestamp, which can be checked
    # honestly.
    healthcheck:
      disable: true
    volumes:
      - storage:/srv/printorian/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  console:
    image: ${PRINTORIAN_CONSOLE_IMAGE:?PRINTORIAN_CONSOLE_IMAGE must be set}
    restart: unless-stopped
    # Bound to the LAN only. The console is never exposed to the internet
    # (ADR-0016); the storefront is, and it lives on the edge VPS.
    ports:
      - "${PRINTORIAN_CONSOLE_BIND:-0.0.0.0}:${PRINTORIAN_CONSOLE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  pgbackup:
  storage:
