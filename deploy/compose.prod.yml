# Printorian — the farm server (ADR-0003).
#
# This is the file the release gate runs in CI and the file that runs on the
# farm. Deliberately one file: a gate that exercises a different compose than
# production proves the images work in an arrangement nobody deploys.
#
# Everything environment-specific arrives from `.env` beside this file, rendered
# from the SOPS-encrypted store in Stage 2. Image digests are written by the
# promotion step in Stage 4 — `PRINTORIAN_IMAGE` carries a digest, not a tag, so
# what was proven is what runs.
#
#   docker compose -f deploy/compose.prod.yml up -d --wait

name: printorian

services:
  # Makes the backup target writable before PostgreSQL wants it.
  #
  # `archive_command` used to open with `mkdir -p /backup/wal`, which the server
  # cannot run: it is uid 70, and the mount underneath is owned by root — a fresh
  # named volume always, and a bind mount on the farm unless somebody remembered
  # to chown it. The archiver then fails on every segment, and because a segment
  # cannot be recycled until it is archived, `pg_wal` grows without bound until
  # the data disk fills and the farm stops.
  #
  # Observed on the development stack before it could happen here: 1 385 failed
  # archives, zero successes, 23 GB of WAL — and a backup guarantee (ADR-0019)
  # that had never once worked while reporting nothing.
  #
  # Root, because chowning a mount is the one thing the server itself cannot do.
  # It exits immediately and everything else waits for it to succeed.
  backup-init:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: root
    restart: "no"
    volumes:
      - ${PRINTORIAN_BACKUP_ROOT:-pgbackup}:/backup
    command: sh -c "mkdir -p /backup/wal && chown -R 70:70 /backup"

  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    depends_on:
      backup-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printorian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-printorian}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # On the farm this is a bind mount onto the backup disk, which must not be
      # the disk holding pgdata — ADR-0019, and the reason the runbook calls a
      # backup on the same spindle decoration.
      - ${PRINTORIAN_BACKUP_ROOT:-pgbackup}:/backup
      # `printorian-backup.service` runs backup.sh *in this container*: it is the
      # one place pg_dump is guaranteed to match the server, and a host-installed
      # client silently becomes a broken backup on the first major upgrade.
      # Read-only -- the script is code, not state.
      - ../backend/scripts:/srv/scripts:ro
    command:
      - postgres
      # Memory. Defaults here are the dev-scale numbers from the root
      # docker-compose.yml; the farm overrides them from its own RAM using the
      # table in RUNBOOK-BACKUP-RESTORE §3. Parameterised rather than guessed,
      # because the right value is a property of the box, not of this file.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      # WAL archiving. On from the start because `archive_mode` needs a restart
      # to change, and a farm that has run for a year is the worst place to
      # discover that (ADR-0019).
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      # No `mkdir` here — see `backup-init`. A command the server has no
      # permission to run fails silently for ever, and PostgreSQL retries the
      # same segment until the disk is gone. Refusing to overwrite an existing
      # segment stays: a silent overwrite corrupts the archive a restore needs.
      # Two properties, and each was learned by losing it.
      #
      # **Atomic.** The old form copied straight to the final name. When the
      # backup disk filled, `cp` left a part-written segment there (786 KB of an
      # expected 16 MB), `test ! -f` then saw a file and the `&&` chain never
      # ran again — archiving stayed wedged after the disk was freed, until
      # somebody deleted that file by hand. Writing to `.tmp` and renaming means
      # a partial segment never appears under the name the check tests for; a
      # rename within one directory is atomic.
      #
      # **Compressed.** Measured on the first farm host: six archived segments,
      # 80 MiB raw, 2.95 MiB gzipped — 27x, and the near-empty ones (which is
      # most of them, because `archive_timeout=1min` switches segments on time
      # rather than on fullness) went 16 MiB -> 16 KiB. At the observed idle rate
      # that is the difference between filling a 98 GiB backup disk in 22 days
      # and in rather more than a year.
      #
      # Restoring therefore needs `restore_command = gunzip -c /backup/wal/%f.gz
      # > %p`, and `pg_archivecleanup` needs `-x .gz`. Both are in
      # RUNBOOK-BACKUP-RESTORE.
      - archive_command=test ! -f /backup/wal/%f.gz && gzip -c %p > /backup/wal/%f.tmp && mv /backup/wal/%f.tmp /backup/wal/%f.gz
      - -c
      - archive_timeout=60
      - -c
      - random_page_cost=1.1
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printorian} -d ${POSTGRES_DB:-printorian}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot. The API must not start against a schema it does not expect, and a
  # migration racing several API replicas is how one of them wins and the others
  # crash-loop. `service_completed_successfully` below makes the ordering a fact
  # rather than a hope.
  migrate:
    image: ${PRINTORIAN_IMAGE:?PRINTORIAN_IMAGE must be set}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    # Same inherited-healthcheck problem as workers, and worse here: migrate is a
    # one-shot that exits, so the curl never succeeds and docker records the
    # container as unhealthy for having done its job correctly. What matters is
    # its exit code, which is what the gate and the deploy timer read.
    healthcheck:
      disable: true
    environment: &backend_env
      PRINTORIAN_ENVIRONMENT: ${PRINTORIAN_ENVIRONMENT:-production}
      PRINTORIAN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-printorian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-printorian}
      PRINTORIAN_REDIS_URL: redis://redis:6379/0
      PRINTORIAN_SECRET_KEY: ${PRINTORIAN_SECRET_KEY:?PRINTORIAN_SECRET_KEY must be set}
      PRINTORIAN_STORAGE_ROOT: /srv/printorian/storage
      PRINTORIAN_FARM_TIMEZONE: ${PRINTORIAN_FARM_TIMEZONE:-Europe/Moscow}
      PRINTORIAN_SITE_URL: ${PRINTORIAN_SITE_URL:-http://localhost:5173}
      PRINTORIAN_PAYMENT_RETURN_URL: ${PRINTORIAN_PAYMENT_RETURN_URL:-http://localhost:5173/orders}
      PRINTORIAN_PAYMENT_PROVIDER: ${PRINTORIAN_PAYMENT_PROVIDER:-mock}
      PRINTORIAN_YOOKASSA_SHOP_ID: ${PRINTORIAN_YOOKASSA_SHOP_ID:-}
      PRINTORIAN_YOOKASSA_SECRET_KEY: ${PRINTORIAN_YOOKASSA_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${PRINTORIAN_IMAGE}
    restart: unless-stopped
    environment: *backend_env
    volumes:
      # The object store. A volume, never the container's writable layer — a
      # rebuild would otherwise take every uploaded model with it.
      - storage:/srv/printorian/storage
      # Read-only, and only so the weekly drill can find last night's dump:
      # `restore_drill.py` runs in this image because it needs the models and
      # alembic, which the postgres image does not have. It reads a dump and
      # never writes one, so the API has no business being able to alter the
      # backups -- that asymmetry is the point of the `:ro`.
      - ${PRINTORIAN_BACKUP_ROOT:-pgbackup}:/backup:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # A separate process, not a second API replica. The SLA clock, the scheduler
  # and the telemetry poller are singletons: running them inside the API would
  # run one copy per API worker, each recomputing the same credits and
  # publishing the same events (docs/DEVELOPMENT.md).
  workers:
    image: ${PRINTORIAN_IMAGE}
    restart: unless-stopped
    command: ["python", "-m", "printorian.workers"]
    environment: *backend_env
    # The image's healthcheck curls the API's /health, because the image is built
    # for three commands and only one of them serves HTTP. Inherited here it
    # reports a worker that is sweeping correctly as unhealthy.
    #
    # Replaced rather than disabled, now that there is something honest to check.
    # `--check` reads the beat each loop records at the *end* of every pass
    # (`printorian.core.heartbeat`), so it fails for a worker that is running and
    # not working — the case a `pgrep` cannot see, and the reason this was left
    # unchecked until the signal existed.
    #
    # Each loop sweeps once before it first waits, so every beat lands within
    # seconds of startup; `start_period` is slack for the slowest of them to
    # finish its first pass — the scheduler's, which connects to the database and
    # refreshes every driver — not for an interval to elapse.
    #
    # Worth knowing: this reports unhealthy when *Redis* is unreachable, because
    # the beats live there and a worker that cannot report is not a worker known
    # to be working. Compose does not restart on unhealthy, so the effect is a
    # true signal rather than a restart loop — but it is a signal about two
    # things, and that is the price of not inventing an answer (ADR-0007).
    healthcheck:
      test: ["CMD", "python", "-m", "printorian.workers", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - storage:/srv/printorian/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  console:
    image: ${PRINTORIAN_CONSOLE_IMAGE:?PRINTORIAN_CONSOLE_IMAGE must be set}
    restart: unless-stopped
    # Bound to the LAN only. The console is never exposed to the internet
    # (ADR-0016); the storefront is, and it lives on the edge VPS.
    ports:
      - "${PRINTORIAN_CONSOLE_BIND:-0.0.0.0}:${PRINTORIAN_CONSOLE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  pgbackup:
  storage:
