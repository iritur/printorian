name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRINTORIAN_ENVIRONMENT: test
  PRINTORIAN_DATABASE_URL: postgresql+asyncpg://printorian:printorian@localhost:5432/printorian

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: printorian
          POSTGRES_PASSWORD: printorian
          POSTGRES_DB: printorian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U printorian -d printorian"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # `-c constraints.txt`: the same pinned set the image is built from, so a
      # green CI run is evidence about the versions that actually ship rather
      # than about whatever pip resolved this morning (`backend/constraints.txt`).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Dependency audit (pip-audit)
        run: |
          # Ensure pip-audit is available; installing separately avoids coupling it to dev extras
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          # Exit non-zero if any vulnerability is found
          pip-audit

      # --- governance gates (ARCHITECTURE §11) -------------------------
      # Each of these encodes a specific way V1 rotted. They run before the
      # tests so a structural regression fails fast and unambiguously.

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy --strict)
        run: mypy

      - name: Architecture contracts (import-linter)
        run: lint-imports

      - name: Context isolation
        run: python tools/check_context_isolation.py

      - name: File length
        run: python tools/check_file_length.py

      # --- tests -------------------------------------------------------

      - name: Tests
        run: pytest -q

      - name: Migrations apply from scratch
        run: alembic upgrade head

      - name: Migrations match the ORM models
        run: alembic check

      # --- API contract -------------------------------------------------
      # The TypeScript client is generated, never hand-edited (ADR-0005).
      # Regenerating must produce no diff, or the client has been tampered with.

      - name: Export OpenAPI schema
        run: python tools/export_openapi.py --out openapi.json

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: backend/openapi.json

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    # The API client is generated from the schema the backend job exports, so the
    # frontend cannot typecheck against a contract that does not exist yet.
    needs: backend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Dependency audit (npm)
        run: |
          # Fail the job for HIGH or CRITICAL vulnerabilities
          npm audit --audit-level=high

      # ADR-0005: the client is generated, never committed. Regenerating here and
      # then typechecking is what makes a breaking backend change fail the build
      # at the commit that caused it.
      - name: Download OpenAPI schema
        uses: actions/download-artifact@v8
        with:
          name: openapi
          path: backend

      - name: Generate API client
        run: npm run generate:api

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  # ------------------------------------------------------------------------
  # The artifact.
  #
  # The two jobs above test the *source tree*. Nothing there proves the thing
  # that actually ships works: a missing system library, a wrong entrypoint, a
  # migration that only runs with a dev dependency present, or a base image that
  # moved underneath us all pass every gate and fail on the farm.
  #
  # So this job builds the images and then runs them — migrations forwards and
  # backwards, readiness, and the console's same-origin proxy — against the same
  # deploy/compose.prod.yml the farm uses. Only then are they pushed.
  #
  # docs/INFRASTRUCTURE.md §6.
  # ------------------------------------------------------------------------
  image:
    name: image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless signing via GitHub OIDC

    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
      CONSOLE_IMAGE: ghcr.io/${{ github.repository }}-console

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built once and loaded into the runner's daemon, so the gate below tests
      # the very bytes that get pushed rather than a rebuild of the same source.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Context is the repository root: the API client is generated from the
      # backend's schema inside this build (ADR-0005).
      - name: Build console image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          target: console
          load: true
          tags: ${{ env.CONSOLE_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- the release gate ---------------------------------------------

      - name: Start the stack
        run: |
          cat > deploy/.env <<EOF
          PRINTORIAN_IMAGE=${BACKEND_IMAGE}:sha-${GITHUB_SHA}
          PRINTORIAN_CONSOLE_IMAGE=${CONSOLE_IMAGE}:sha-${GITHUB_SHA}
          POSTGRES_PASSWORD=release-gate-only
          PRINTORIAN_SECRET_KEY=release-gate-only-not-a-real-secret
          PRINTORIAN_ENVIRONMENT=staging
          EOF
          docker compose -f deploy/compose.prod.yml --env-file deploy/.env up -d

      # Deliberately not `up --wait`: it refuses to wait on a stack containing a
      # service with no healthcheck, and the workers container has none on
      # purpose — it serves no HTTP, and a process check that cannot tell working
      # from wedged is worse than none (deploy/compose.prod.yml).
      #
      # Waiting explicitly is also more precise: `--wait` asserts "docker thinks
      # everything is fine", this asserts what the gate actually cares about and
      # names whichever part failed.
      - name: Wait for the stack
        run: |
          set -euo pipefail
          await() {
            for _ in $(seq 60); do
              [ "$(docker inspect -f "$2" "$1" 2>/dev/null)" = "$3" ] && { echo "$1 -> $3"; return 0; }
              sleep 3
            done
            echo "::error::$1 never reached $3"
            docker logs "$1" 2>&1 | tail -40
            return 1
          }
          # backup-init first: everything else depends on it, so when it fails the
          # symptom is postgres never starting and migrate never running — which
          # would be reported here as a migrate timeout, sending whoever reads the
          # log to the wrong container.
          await printorian-backup-init-1 '{{.State.Status}}' exited
          test "$(docker inspect -f '{{.State.ExitCode}}' printorian-backup-init-1)" = 0
          await printorian-migrate-1 '{{.State.Status}}' exited
          test "$(docker inspect -f '{{.State.ExitCode}}' printorian-migrate-1)" = 0
          await printorian-api-1     '{{.State.Health.Status}}' healthy
          await printorian-console-1 '{{.State.Health.Status}}' healthy
          # The workers have a real healthcheck now — it reads the beat each loop
          # records at the end of a pass, so this asserts they are *sweeping*
          # rather than merely running (printorian/core/heartbeat.py).
          await printorian-workers-1 '{{.State.Health.Status}}' healthy

      - name: Migrations apply, reverse and re-apply in the image
        run: |
          run() { docker compose -f deploy/compose.prod.yml --env-file deploy/.env \
                    run --rm --no-deps migrate "$@"; }
          run alembic downgrade base
          run alembic upgrade head
          run alembic check

      - name: Readiness reports its dependencies
        run: |
          body=$(docker compose -f deploy/compose.prod.yml --env-file deploy/.env \
                   exec -T api curl -fsS http://127.0.0.1:8000/health/ready)
          echo "$body"
          echo "$body" | grep -q '"database":"ok"'

      - name: Console serves the bundle and proxies the API same-origin
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'

      # Every loop, by name. `--check` exits non-zero if any of them has not swept
      # within its own window, so this is the gate noticing a wedged sweep — the
      # thing the container's disabled healthcheck could never do.
      - name: Every worker loop is sweeping
        run: |
          compose() { docker compose -f deploy/compose.prod.yml --env-file deploy/.env "$@"; }
          compose exec -T workers python -m printorian.workers --check
          compose logs workers | tail -20

      # The guard's decision, in real bash with a real curl. There is no shellcheck
      # and no bats harness in this repository, and this is the only job with a
      # Linux shell, a running stack and an empty database — so it is the only place
      # `deploy/reboot-guard.sh` can be driven rather than read.
      #
      # The seam this leaves, stated rather than hidden: pytest proves the endpoint
      # answers 503 while a job is printing, and this proves 503 defers. Nothing
      # proves those are the same 503, because staging a PRINTING row inside the
      # release-gate stack would mean hand-writing an insert naming every non-null
      # column of `print_jobs` — a fixture that would break on the next schema change
      # and would be repaired by whoever broke it rather than by whoever owns this.
      - name: The reboot guard defers unless the farm says it is quiet
        run: |
          set -euo pipefail
          guard() { PRINTORIAN_HEALTH_URL="$1" PRINTORIAN_GUARD_TIMEOUT=5 bash deploy/reboot-guard.sh; }

          # 1. Against the live stack, whose database is empty. A guard that never
          #    permits anything would pass all three refusals below and be useless,
          #    so the affirmative is asserted first.
          guard http://127.0.0.1:8080/api/health/printing

          # 2. Nothing listening. An API that is down is not permission to reboot —
          #    and this is the case a naive `curl | grep -q quiet` would wave
          #    through, because a pipeline returns grep's status and not curl's.
          ! guard http://127.0.0.1:9/health/printing

          # A stub for the two body-shaped refusals, which cannot be produced from
          # the live stack without staging a print in it.
          cat > /tmp/health-stub.py <<'PY'
          import sys
          from http.server import BaseHTTPRequestHandler, HTTPServer

          code, body = int(sys.argv[1]), sys.argv[2].encode()


          class Stub(BaseHTTPRequestHandler):
              def do_GET(self) -> None:
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args: object) -> None:
                  pass


          HTTPServer(("127.0.0.1", 8099), Stub).serve_forever()
          PY

          # Waits for the stub AND asserts it is answering with the code asked for.
          # Without the assertion, a stub that never started would make every
          # refusal below pass for the wrong reason — the guard would be refusing a
          # dead port, not the body it was given, and case 4 in particular would
          # then prove nothing at all.
          serve() {
            python3 /tmp/health-stub.py "$1" "$2" &
            STUB=$!
            for _ in $(seq 30); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/health/printing)" = "$1" ] && return 0
              sleep 1
            done
            echo "::error::the stub never answered $1 on 127.0.0.1:8099"
            return 1
          }
          stop() { kill "$STUB"; wait "$STUB" 2>/dev/null || true; }

          # 3. The farm saying it is busy, in the shape the endpoint really uses.
          serve 503 '{"status":"in_flight","in_flight":{"assigned":0,"dispatching":0,"printing":1}}'
          ! guard http://127.0.0.1:8099/health/printing
          stop

          # 4. A cheerful 200 that carries no verdict — a proxy error page, a captive
          #    portal, or this route renamed under a catch-all. Not permission either.
          serve 200 '{"status":"ok"}'
          ! guard http://127.0.0.1:8099/health/printing
          stop

      # Live events cross the process boundary. The API and the workers are
      # separate containers with an in-process bus each, so without the relay
      # every event a sweep raises dies in the worker and the console's boards
      # are live only for what somebody clicked. Redis URL, channel and the
      # network between the containers are properties of *this* arrangement, so
      # they are proved here rather than in a unit test.
      - name: The event relay carries events between processes
        run: |
          compose() { docker compose -f deploy/compose.prod.yml --env-file deploy/.env "$@"; }
          compose exec -T api python tools/relay_probe.py

      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose.prod.yml --env-file deploy/.env logs || true
          docker compose -f deploy/compose.prod.yml --env-file deploy/.env down -v || true

      # --- supply chain --------------------------------------------------

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true      # only fail on something actually actionable

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          artifact-name: sbom-backend.spdx.json

      # --- publish -------------------------------------------------------
      # Only from main. A pull request proves its images work; it does not get to
      # put them where the farm can pull them.

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.ref == 'refs/heads/main'
        id: push
        run: |
          docker push "${BACKEND_IMAGE}:sha-${GITHUB_SHA}"
          docker push "${CONSOLE_IMAGE}:sha-${GITHUB_SHA}"
          {
            echo "backend_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${BACKEND_IMAGE}:sha-${GITHUB_SHA}")"
            echo "console_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${CONSOLE_IMAGE}:sha-${GITHUB_SHA}")"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      # Keyless, via the job's OIDC identity — no key to store, rotate or lose.
      # The farm verifies this signature before running anything (Stage 4), which
      # is what makes pull-based delivery a trust decision rather than a habit.
      - name: Sign
        if: github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes "${{ steps.push.outputs.backend_digest }}"
          cosign sign --yes "${{ steps.push.outputs.console_digest }}"

      - name: Summary
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo "### Images published"
            echo '```'
            echo "${{ steps.push.outputs.backend_digest }}"
            echo "${{ steps.push.outputs.console_digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
